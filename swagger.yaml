      summary: Criar Restaurante
      description: Este endpoint cria um especifico Restaurante.
      operationId: createRestaurant
      requestBody:
        required: true
        content:
          application/json:
            schema: 
              $ref: "#/components/schemas/createRestaurant"
      responses:
        '200':
          description: Sucesso retorna o dados do Restaurante criado.
          content:
            application/json:
              schema:
