          required: true
          schema:
            type: integer
            format: int32
        - name: page
          in: path
          description: numero de conteudo na pagina
          required: true
          schema:
            type: integer
            format: int32
      responses:
        '200':
          description: Sucesso retorna os dados buscado no banco com a data da criação, a data da ultima modificação, a regras com o tipo de itens registrado no cardapio.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/cardapioList"
        '400':
          description: Erro ao enviar a requisição, não reconhecendo o body enviado 
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error400"
                  
        '404':
          description: Erro ao enviar a requisição, não reconhecendo o endpoint acessado 
