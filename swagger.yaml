components:
  schemas:
    create:
      type: object
      properties:
        nome:
          type: string
          description: nome do usuario
          example: Nome Proprio
        username:
          type: string
          description: username do usuario
          example: theUser
        senha:
          type: string
          description: senha do usuario
          example: pass123
        email:
          type: string
          format: email
          description: email do usuario
          example: user@exemplo.com
        regras: 
          type: integer
          description: representa o tipo de conta, sendo 0 dono e 1 cliente
          example: 0
        endereco:
          type: object
          properties:
            CEP:
              type: string
              description: cep do endereço somente numeral
              example: 01001000
            logradouro:
              type: string
              description: endereço do presente no cep
              example: Rua Osvaldo
            bairro:
              type: string
              description: bairro do presente no cep
              example: Sé
            cidade:
              type: string
              description: cidade do presente no cep
              example: São Paulo
        numero:
          type: number
          description: numero do endereço do usuario
          example: 25
    update:
      type: object
      properties:
        nome:
          type: string
          description: nome do usuario
          example: Nome Proprio
        username:
          type: string
          description: username do usuario
          example: theUser
        email:
          type: string
          format: email
          description: email do usuario
          example: user@exemplo.com
        regras: 
          type: integer
          description: representa o tipo de conta, sendo 0 dono e 1 cliente
          example: 0
        endereco:
          type: object
          properties:
            CEP:
              type: string
              description: cep do endereço somente numeral
              example: 01001000
            logradouro:
              type: string
              description: endereço do presente no cep
              example: Rua Osvaldo
            bairro:
              type: string
              description: bairro do presente no cep
              example: Sé
            cidade:
              type: string
              description: cidade do presente no cep
              example: São Paulo
        numero:
          type: number
          description: numero do endereço do usuario
          example: 25  
    change:
      type: object
      properties:
        username:
          type: string
          description: username do usuario
          example: theUser
        senha:
          type: string
          description: senha nova do usuario
          example: pass123
    tokens:
      type: object
      properties:
        token:
          type: string
          format: byte
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJyZXN0YXVyYW50I
    usuarioResponse:
      type: object
      properties:
        nome:
          type: string
          description: nome do usuario
          example: Nome Proprio
        username:
          type: string
          description: username do usuario
          example: theUser
        senha:
          type: string
          description: senha do usuario
          example: pass123
        email:
          type: string
          format: email
          description: email do usuario
