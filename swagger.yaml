        '500':
          description: Erro ao acessar o serviço, falha ao tentar acessar o serviço
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error500"
      security:
      - bearerAuth: []
  /cardapio/create:
    post:
      summary: Criar item do Cardapio
      description: Este endpoint cria um Cardapio para especifico Restaurant.
      operationId: createCardapio
