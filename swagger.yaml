        '500':
          description: Erro ao acessar o serviço, falha ao tentar acessar o serviço
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error500" 
      security:
      - bearerAuth: []
  /cardapio/delete/{product}:
    delete:
      summary: Desativa o item do cardapio
      description: Este endpoint desativa o item presente no cardapio de especifico usuario.
      operationId: deleteCardapio
      parameters:
        - name: product
          in: path
          description: username a ser alterado
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Sucesso retorna os dados da conta desativada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/cardapioResponse"
        '400':
          description: Erro ao enviar a requisição, não reconhecendo o body enviado 
          content:
            application/json:
              schema:
