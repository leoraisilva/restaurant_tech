      summary: Alterar Restaurant
      description: Este endpoint altera o especifico Restaurant.
      operationId: updateRestaurant
      requestBody:
        required: true
        content:
          application/json:
            schema: 
              $ref: "#/components/schemas/updateRestaurant"
      responses:
        '200':
          description: Sucesso retorna o dados do Restaurant alterado.
          content:
